name: Release builds
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    # Packaging itself, and everything the packaged app ships: core, shared and the UI.
    paths:
      - "apps/desktop/**"
      - ".github/workflows/release.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/core/package.json"
      - "packages/core/src/**"
      - "packages/shared/src/**"
      - "apps/ui/src/**"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: mac-arm64 }
          - { os: macos-15-intel, name: mac-x64 }
          - { os: windows-latest, name: win-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Plan 9B: signing secrets are added here, and THETERMINAL_SIGN=1 switches builderConfig to signing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "THETERMINAL_VERSION=$v" >> "$GITHUB_ENV"
      # The smoke suite's refusal test runs packages/core/dist/cli.js from the repo.
      - run: pnpm build
      - run: pnpm --filter @theterminal/desktop dist
      - name: Install from the dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach apps/desktop/release/*.dmg -nobrowse -readonly -mountpoint "$mnt"
          echo "TT_DESKTOP_APP=$mnt/The Terminal.app/Contents/MacOS/The Terminal" >> "$GITHUB_ENV"
      - name: Install from the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release -Filter *.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -Filter 'The Terminal.exe' | Select-Object -First 1
          if (-not $app) { throw "The installed app was not found under $env:LOCALAPPDATA\Programs" }
          "TT_DESKTOP_APP=$($app.FullName)" >> $env:GITHUB_ENV
      - run: pnpm exec playwright test -c apps/desktop/smoke/playwright.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TheTerminal-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      # Idempotent: a re-run of the tag (or a second dispatch) replaces the assets of the existing draft.
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME (unsigned)" --notes "Unsigned test builds. See README, Desktop app." dist/*
          fi
