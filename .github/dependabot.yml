# Dependabot keeps dependencies current and patches known vulnerabilities.
#
# - Security updates: opened as soon as GitHub publishes an advisory for a
#   dependency we use (enabled in the repository's security settings).
#   They skip the cooldown below.
# - Version updates: checked weekly. A new release must be at least 14 days
#   old before Dependabot proposes it, so we never adopt a release in its
#   first days (supply-chain caution). Minor and patch updates are grouped
#   into one pull request per ecosystem; major updates arrive one by one,
#   because they can change behaviour and need their own review.
#
# Every Dependabot pull request runs the full CI on macOS and Windows and is
# merged only after the maintainer reviews it.
version: 2
updates:
  - package-ecosystem: npm
    # The root only: pnpm resolves the whole workspace from the one lockfile, so a bump of a package declared in
    # several workspace packages is one pull request instead of one per directory.
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        update-types: [minor, patch]
    ignore:
      # The Node types follow the oldest Node the server supports (package.json engines: node >=22). A newer
      # major of @types/node describes APIs that Node 22 lacks, so only its minor and patch updates are taken
      # until engines moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Electron 45.2.1 crashed the desktop app's main process on macOS (a native segfault while freeing a
      # Node handle). Stay on 44 until a 45 release is tried by hand and runs cleanly.
      - dependency-name: "electron"
        versions: [">=45"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
