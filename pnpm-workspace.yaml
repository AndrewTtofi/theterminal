packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  esbuild: true
  better-sqlite3: true
  # Optional native helpers of the bundled Gemini CLI. Its ACP mode needs neither, so their build scripts never run.
  "@github/keytar": false
  node-pty: false
  # Squirrel.Windows target of electron-builder (via its auto-installed peer); unused (NSIS only). Its script only picks a 7-Zip binary.
  electron-winstaller: false

# Pin the docking library and its transitive packages to one reviewed version.
overrides:
  dockview: 8.8.3
  dockview-core: 8.8.3
  # Vite 8's bundler and its plugin helpers would resolve to releases younger than the 14 days this repository waits
  # before adopting one (see .github/dependabot.yml). Hold the newest mature releases instead. The selectors are
  # scoped to these lines, so a future Vite that needs a newer line is not pinned down; drop them once the current
  # picks are old enough.
  "rolldown@~1.2": 1.2.16
  "@rolldown/pluginutils@^1": 1.0.1
